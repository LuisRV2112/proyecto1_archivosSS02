spring.application.name=backend
server.port=8080

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mini_erp
spring.datasource.username=erp
spring.datasource.password=erp

# Flyway es el UNICO responsable de crear y modificar las tablas
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate solo VALIDA que las entidades coincidan con las tablas; nunca las crea.
# Con "update" o "create" Hibernate y Flyway se disputarian el control del esquema:
# Flyway ya dejo las tablas exactas del diseno (con sus CHECK, indices parciales y
# columnas GENERATED), y "update" podria alterarlas o crear unas distintas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (se usa en la Fase 2; minimo 32 caracteres)
app.jwt.secreto=CAMBIAR-esta-clave-de-desarrollo-minierp-2026-segura
app.jwt.expiracion-horas=8
